[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qhpc-runner"
version = "0.2.0"
description = "Restart-safe Slurm experiment runner for QHPC workloads on Queen's Frontenac cluster"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
report = ["matplotlib>=3.7"]

[project.scripts]
qhpc-run = "qhpc_runner.cli:main"

[tool.setuptools.packages.find]
include = ["qhpc_runner*"]
