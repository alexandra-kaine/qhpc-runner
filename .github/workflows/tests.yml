name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build OpenMP example
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make
          make -C examples/openmp
      - name: Smoke-test workload
        run: OMP_NUM_THREADS=2 ./bin/openmp_integrate --steps 100000
